<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Planner</title>
<meta name="theme-color" content="#6B5B95">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/calendario.css">
<link rel="stylesheet" href="css/habitos.css">
<link rel="stylesheet" href="css/medicamentos.css">
<link rel="stylesheet" href="css/nutricao.css">
<link rel="stylesheet" href="css/pensamentos.css">
<link rel="stylesheet" href="css/financas.css">
<link rel="stylesheet" href="css/tarefas.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1 class="app-title">Meu Planner<em>.</em></h1>
    <p class="login-subtitle">Entre pra acessar seus dados, de qualquer aparelho.</p>
    <button id="googleSignInBtn" class="btn-primary login-google-btn">Entrar com Google</button>
  </div>
</div>

<div id="appShell" style="display:none;">
  <nav class="side-nav" id="sideNav">
    <button type="button" class="snav-btn" data-section="calendario"><span class="snav-icon" data-icon="calendar"></span><span class="snav-label">Calendário</span></button>
    <button type="button" class="snav-btn" data-section="habitos"><span class="snav-icon" data-icon="repeat"></span><span class="snav-label">Hábitos</span></button>
    <button type="button" class="snav-btn" data-section="nutricao"><span class="snav-icon" data-icon="utensils"></span><span class="snav-label">Nutrição</span></button>
    <button type="button" class="snav-btn" data-section="pensamentos"><span class="snav-icon" data-icon="bubble"></span><span class="snav-label">Pensamentos</span></button>
    <button type="button" class="snav-btn" data-section="financeiro"><span class="snav-icon" data-icon="wallet"></span><span class="snav-label">Finanças</span></button>
    <button type="button" class="snav-btn" data-section="tarefas"><span class="snav-icon" data-icon="checkSquare"></span><span class="snav-label">Tarefas</span></button>
    <button type="button" class="snav-btn" data-section="medicamentos"><span class="snav-icon" data-icon="pill"></span><span class="snav-label">Medicamentos</span></button>
  </nav>

  <div class="app-content">
    <header class="app-header">
      <div class="header-top">
        <h1 class="app-title">Meu Planner<em>.</em></h1>
        <div class="header-actions">
          <span id="userEmailLabel" class="user-email-label"></span>
          <button id="signOutBtn" class="signout-btn" title="Sair">Sair</button>
          <button id="fileStatusBtn" class="file-status-btn" title="Arquivo de dados"></button>
        </div>
      </div>
      <p class="app-subtitle">Ano, mês, semana, dia e financeiro — tudo em um só lugar.</p>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="month-strip" id="monthStrip"></div>
      <div class="pauta"></div>
    </header>

    <div id="reconnectBanner" class="reconnect-banner">
      <span>🔒 Toque pra reconectar seu arquivo de dados</span>
      <button id="reconnectBtn">Reconectar</button>
    </div>

    <main>
      <div class="card" id="viewRoot"></div>
    </main>

    <footer>Seus dados ficam salvos na sua conta e também neste navegador — acesse de qualquer aparelho, mesmo offline.</footer>
  </div>

  <button id="fabAdd" class="fab-btn" title="Adicionar">+</button>
  <div class="modal-overlay" id="addModalOverlay">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>
  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal-sheet" id="settingsSheet"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
